<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>極簡記帳本</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">

    <!-- 頂部導覽列 -->
    <header class="bg-white border-b border-gray-200 py-4 px-8 flex justify-between items-center shadow-sm">
        <h1 class="text-xl font-semibold tracking-tight text-gray-900">Minimal Ledger <span class="text-xs font-normal text-gray-500 ml-2">極簡記帳本</span></h1>
        <div class="space-x-2">
            <button onclick="exportData()" class="text-xs bg-white border border-gray-300 hover:bg-gray-100 text-gray-700 px-3 py-1.5 rounded transition">匯出備份 (JSON)</button>
            <label class="text-xs bg-white border border-gray-300 hover:bg-gray-100 text-gray-700 px-3 py-1.5 rounded cursor-pointer transition inline-block">
                匯入還原
                <input type="file" id="importFile" class="hidden" accept=".json" onchange="importData(event)">
            </label>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="flex-grow max-w-7xl w-full mx-auto p-6 lg:p-8 grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <!-- 左側：快速記帳與數據概覽 (佔 1 欄) -->
        <div class="space-y-6">
            <!-- 記帳表單卡片 -->
            <div class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm">
                <h2 class="text-sm font-semibold uppercase tracking-wider text-gray-500 mb-4">新增記帳</h2>
                <form id="transactionForm" onsubmit="addTransaction(event)" class="space-y-4">
                    <!-- 收支切換 -->
                    <div class="grid grid-cols-2 gap-2 p-1 bg-gray-100 rounded-lg">
                        <button type="button" id="typeExpense" onclick="setType('expense')" class="py-1.5 text-xs font-medium rounded-md transition bg-white text-gray-900 shadow-sm">支出</button>
                        <button type="button" id="typeIncome" onclick="setType('income')" class="py-1.5 text-xs font-medium rounded-md transition text-gray-500 hover:text-gray-900">收入</button>
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1">金額 (TWD)</label>
                        <input type="number" id="amount" required min="1" placeholder="例如：150" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-1 focus:ring-gray-900 focus:border-gray-900">
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1">分類</label>
                        <select id="category" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm bg-white focus:outline-none focus:ring-1 focus:ring-gray-900 focus:border-gray-900">
                            <!-- 動態載入分類選項 -->
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1">日期</label>
                        <input type="date" id="date" required class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-1 focus:ring-gray-900 focus:border-gray-900">
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1">備註 (選填)</label>
                        <input type="text" id="note" placeholder="例如：午餐吃排骨飯" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-1 focus:ring-gray-900 focus:border-gray-900">
                    </div>

                    <button type="submit" class="w-full bg-gray-900 hover:bg-black text-white py-2 rounded-lg text-sm font-medium transition shadow-sm">
                        新增紀錄
                    </button>
                </form>
            </div>

            <!-- 本月收支摘要卡片 -->
            <div class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm space-y-4">
                <h2 class="text-sm font-semibold uppercase tracking-wider text-gray-500">本月收支概覽</h2>
                <div class="grid grid-cols-3 gap-2 text-center">
                    <div class="p-3 bg-gray-50 rounded-lg">
                        <div class="text-xs text-gray-500">總收入</div>
                        <div id="summaryIncome" class="text-sm font-semibold text-emerald-600 mt-1">\$0</div>
                    </div>
                    <div class="p-3 bg-gray-50 rounded-lg">
                        <div class="text-xs text-gray-500">總支出</div>
                        <div id="summaryExpense" class="text-sm font-semibold text-gray-900 mt-1">\$0</div>
                    </div>
                    <div class="p-3 bg-gray-50 rounded-lg">
                        <div class="text-xs text-gray-500">結餘</div>
                        <div id="summaryBalance" class="text-sm font-semibold text-gray-900 mt-1">\$0</div>
                    </div>
                </div>

                <!-- 圓餅圖容器 -->
                <div class="pt-4 border-t border-gray-100">
                    <div class="text-xs font-medium text-gray-500 mb-2">支出類別占比</div>
                    <div class="relative h-48 flex justify-center items-center">
                        <canvas id="expenseChart"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <!-- 右側：歷史明細與搜尋篩選 (佔 2 欄) -->
        <div class="lg:col-span-2 space-y-6">
            <div class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm flex flex-col h-full">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
                    <h2 class="text-sm font-semibold uppercase tracking-wider text-gray-500">歷史明細紀錄</h2>
                    
                    <!-- 搜尋與篩選列 -->
                    <div class="flex flex-wrap items-center gap-2 w-full sm:w-auto">
                        <input type="text" id="searchInput" placeholder="搜尋備註..." oninput="renderTable()" class="px-3 py-1.5 border border-gray-300 rounded-lg text-xs focus:outline-none focus:ring-1 focus:ring-gray-900 w-full sm:w-40">
                        <select id="filterCategory" onchange="renderTable()" class="px-3 py-1.5 border border-gray-300 rounded-lg text-xs bg-white focus:outline-none focus:ring-1 focus:ring-gray-900">
                            <option value="all">所有類別</option>
                        </select>
                        <select id="filterType" onchange="renderTable()" class="px-3 py-1.5 border border-gray-300 rounded-lg text-xs bg-white focus:outline-none focus:ring-1 focus:ring-gray-900">
                            <option value="all">全部收支</option>
                            <option value="expense">支出</option>
                            <option value="income">收入</option>
                        </select>
                    </div>
                </div>

                <!-- 明細表格 -->
                <div class="overflow-x-auto flex-grow">
                    <table class="w-full text-left border-collapse text-sm">
                        <thead>
                            <tr class="border-b border-gray-200 text-xs text-gray-400 uppercase tracking-wider">
                                <th class="py-3 px-4 font-medium">日期</th>
                                <th class="py-3 px-4 font-medium">類型</th>
                                <th class="py-3 px-4 font-medium">分類</th>
                                <th class="py-3 px-4 font-medium">備註</th>
                                <th class="py-3 px-4 font-medium text-right">金額</th>
                                <th class="py-3 px-4 font-medium text-center">操作</th>
                            </tr>
                        </thead>
                        <tbody id="transactionTableBody" class="divide-y divide-gray-100">
                            <!-- 動態插入紀錄 -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </main>

    <!-- JavaScript 邏輯 -->
    <script>
        // 分類定義
        const categories = {
            expense: ['餐飲', '交通', '娛樂', '居家', '購物', '醫療', '其他'],
            income: ['薪資', '獎金', '投資', '其他']
        };

        let currentType = 'expense';
        let transactions = JSON.parse(localStorage.getItem('transactions')) || [];
        let expenseChart = null;

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            // 設定預設日期為今天
            document.getElementById('date').valueAsDate = new Date();
            updateCategoryOptions();
            renderTable();
            updateSummaryAndChart();
        });

        // 切換收支類型
        function setType(type) {
            currentType = type;
            const btnExp = document.getElementById('typeExpense');
            const btnInc = document.getElementById('typeIncome');

            if (type === 'expense') {
                btnExp.className = "py-1.5 text-xs font-medium rounded-md transition bg-white text-gray-900 shadow-sm";
                btnInc.className = "py-1.5 text-xs font-medium rounded-md transition text-gray-500 hover:text-gray-900";
            } else {
                btnInc.className = "py-1.5 text-xs font-medium rounded-md transition bg-white text-gray-900 shadow-sm";
                btnExp.className = "py-1.5 text-xs font-medium rounded-md transition text-gray-500 hover:text-gray-900";
            }
            updateCategoryOptions();
        }

        // 更新分類選單
        function updateCategoryOptions() {
            const select = document.getElementById('category');
            select.innerHTML = '';
            categories[currentType].forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat;
                opt.textContent = cat;
                select.appendChild(opt);
            });

            // 同時更新篩選類別的選項
            const filterSelect = document.getElementById('filterCategory');
            // 保留原本的「所有類別」
            filterSelect.innerHTML = '<option value="all">所有類別</option>';
            [...categories.expense, ...categories.income].forEach(cat => {
                if (![...filterSelect.options].some(o => o.value === cat)) {
                    const opt = document.createElement('option');
                    opt.value = cat;
                    opt.textContent = cat;
                    filterSelect.appendChild(opt);
                }
            });
        }

        // 新增交易
        function addTransaction(e) {
            e.preventDefault();
            const amount = parseFloat(document.getElementById('amount').value);
            const category = document.getElementById('category').value;
            const date = document.getElementById('date').value;
            const note = document.getElementById('note').value.trim();

            const newTx = {
                id: Date.now(),
                type: currentType,
                amount: amount,
                category: category,
                date: date,
                note: note
            };

            transactions.unshift(newTx); // 新增到最前面
            saveAndRefresh();

            // 重設表單金額與備註
            document.getElementById('amount').value = '';
            document.getElementById('note').value = '';
            document.getElementById('date').valueAsDate = new Date();
        }

        // 刪除交易
        function deleteTransaction(id) {
            transactions = transactions.filter(tx => tx.id !== id);
            saveAndRefresh();
        }

        // 儲存並重新渲染
        function saveAndRefresh() {
            localStorage.setItem('transactions', JSON.stringify(transactions));
            renderTable();
            updateSummaryAndChart();
        }

        // 渲染表格與搜尋篩選
        function renderTable() {
            const tbody = document.getElementById('transactionTableBody');
            const searchKeyword = document.getElementById('searchInput').value.toLowerCase();
            const filterCategory = document.getElementById('filterCategory').value;
            const filterType = document.getElementById('filterType').value;

            const filtered = transactions.filter(tx => {
                const matchSearch = tx.note.toLowerCase().includes(searchKeyword) || tx.category.toLowerCase().includes(searchKeyword);
                const matchCat = filterCategory === 'all' || tx.category === filterCategory;
                const matchType = filterType === 'all' || tx.type === filterType;
                return matchSearch && matchCat && matchType;
            });

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="py-6 text-center text-xs text-gray-400">沒有找到相關紀錄</td></tr>`;
                return;
            }

            tbody.innerHTML = filtered.map(tx => `
                <tr class="hover:bg-gray-50 transition">
                    <td class="py-3 px-4 text-xs text-gray-500">${tx.date}</td>
                    <td class="py-3 px-4 text-xs">
                        <span class="px-2 py-0.5 rounded text-[10px] font-medium ${tx.type === 'income' ? 'bg-emerald-50 text-emerald-600' : 'bg-gray-100 text-gray-600'}">
                            ${tx.type === 'income' ? '收入' : '支出'}
                        </span>
                    </td>
                    <td class="py-3 px-4 text-xs font-medium text-gray-800">${tx.category}</td>
                    <td class="py-3 px-4 text-xs text-gray-600">${tx.note || '-'}</td>
                    <td class="py-3 px-4 text-xs font-semibold text-right ${tx.type === 'income' ? 'text-emerald-600' : 'text-gray-900'}">
                        ${tx.type === 'income' ? '+' : '-'}$${tx.amount.toLocaleString()}
                    </td>
                    <td class="py-3 px-4 text-xs text-center">
                        <button onclick="deleteTransaction(${tx.id})" class="text-gray-400 hover:text-red-500 transition">刪除</button>
                    </td>
                </tr>
            `).join('');
        }

        // 更新摘要與圓餅圖
        function updateSummaryAndChart() {
            let totalIncome = 0;
            let totalExpense = 0;
            const expenseByCategory = {};

            transactions.forEach(tx => {
                if (tx.type === 'income') {
                    totalIncome += tx.amount;
                } else {
                    totalExpense += tx.amount;
                    expenseByCategory[tx.category] = (expenseByCategory[tx.category] || 0) + tx.amount;
                }
            });

            const balance = totalIncome - totalExpense;

            document.getElementById('summaryIncome').textContent = `$${totalIncome.toLocaleString()}`;
            document.getElementById('summaryExpense').textContent = `$${totalExpense.toLocaleString()}`;
            
            const balanceEl = document.getElementById('summaryBalance');
            balanceEl.textContent = `$${balance.toLocaleString()}`;
            balanceEl.className = `text-sm font-semibold mt-1 ${balance >= 0 ? 'text-gray-900' : 'text-red-500'}`;

            // 更新圓餅圖
            const ctx = document.getElementById('expenseChart').getContext('2d');
            const labels = Object.keys(expenseByCategory);
            const data = Object.values(expenseByCategory);

            if (expenseChart) {
                expenseChart.destroy();
            }

            if (data.length === 0) {
                // 如果沒有支出資料，畫一個空的提示圖表或不顯示
                expenseChart = new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: ['尚無支出資料'],
                        datasets: [{ data: [1], backgroundColor: ['#f3f4f6'] }]
                    },
                    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
                });
                return;
            }

            expenseChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: data,
                        backgroundColor: [
                            '#111827', '#4b5563', '#9ca3af', '#d1d5db', '#6b7280', '#374151', '#1f2937'
                        ],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'right',
                            labels: { boxWidth: 10, font: { size: 10 } }
                        }
                    },
                    cutout: '70%'
                }
            });
        }

        // 匯出 JSON 備份
        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(transactions, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `ledger_backup_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        // 匯入 JSON 還原
        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (Array.isArray(imported)) {
                        transactions = imported;
                        saveAndRefresh();
                        alert('資料還原成功！');
                    } else {
                        alert('檔案格式錯誤！');
                    }
                } catch (err) {
                    alert('無法解析 JSON 檔案！');
                }
            };
            reader.readAsText(file);
        }
    </script>
</body>
</html>
